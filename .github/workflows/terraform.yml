name: Terraform infrastructure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: 1.14.0
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: Validate both root modules without cloud credentials
        run: |
          for module in bootstrap terraform; do
            terraform -chdir="$module" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$module" validate -no-color
          done

  apply:
    name: Plan and automatically apply main
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: terraform-main
      cancel-in-progress: false
      queue: max
    env:
      YC_CLOUD_ID: ${{ vars.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      API_ALLOWED_CIDRS: ${{ secrets.API_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Prepare local credentials and backend
        run: |
          export YC_SERVICE_ACCOUNT_KEY_FILE="$RUNNER_TEMP/yc-service-account.json"
          printf 'YC_SERVICE_ACCOUNT_KEY_FILE=%s\n' "$YC_SERVICE_ACCOUNT_KEY_FILE" >> "$GITHUB_ENV"
          set -Eeuo pipefail
          umask 077

          for key in YC_CLOUD_ID YC_FOLDER_ID YC_SERVICE_ACCOUNT_ID TF_STATE_BUCKET YC_SERVICE_ACCOUNT_KEY YC_SERVICE_ACCOUNT_KEY_FILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY API_ALLOWED_CIDRS; do
            [[ -n "${!key:-}" ]] || { printf 'Missing GitHub Actions setting: %s\n' "$key" >&2; exit 1; }
          done
          for key in YC_CLOUD_ID YC_FOLDER_ID YC_SERVICE_ACCOUNT_ID; do
            [[ "${!key}" =~ ^[a-z0-9]{20}$ ]] || { printf 'Invalid ID setting: %s\n' "$key" >&2; exit 1; }
          done
          [[ "$TF_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo 'Invalid bucket name.' >&2; exit 1; }

          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}/32$"))' <<< "$API_ALLOWED_CIDRS" >/dev/null
          while IFS= read -r cidr; do printf '::add-mask::%s\n' "$cidr"; done < <(jq -r '.[]' <<< "$API_ALLOWED_CIDRS")

          printf '%s' "$YC_SERVICE_ACCOUNT_KEY" > "$YC_SERVICE_ACCOUNT_KEY_FILE"
          jq -e --arg id "$YC_SERVICE_ACCOUNT_ID" '.service_account_id == $id and (.private_key | type == "string" and length > 100)' "$YC_SERVICE_ACCOUNT_KEY_FILE" >/dev/null

          jq -n --arg cloud "$YC_CLOUD_ID" --arg folder "$YC_FOLDER_ID" --arg account "$YC_SERVICE_ACCOUNT_ID" --argjson cidrs "$API_ALLOWED_CIDRS" \
            '{cloud_id:$cloud, folder_id:$folder, service_account_id:$account, project_name:"diplom", api_allowed_cidrs:$cidrs}' > terraform/terraform.auto.tfvars.json

          cat > terraform/backend.ci.hcl <<EOF
          bucket = "$TF_STATE_BUCKET"
          key    = "diploma/infrastructure.tfstate"
          region = "ru-central1"
          endpoints = { s3 = "https://storage.yandexcloud.net" }
          skip_region_validation      = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          use_path_style              = true
          use_lockfile                = true
          EOF
          echo 'Terraform credentials and existing S3 backend prepared.'
      - name: Initialize existing S3 state
        run: terraform -chdir=terraform init -input=false -lockfile=readonly -backend-config=backend.ci.hcl
      - name: Plan
        run: terraform -chdir=terraform plan -input=false -no-color -lock-timeout=10m -out="$RUNNER_TEMP/terraform.tfplan"
      - name: Apply the saved plan
        run: terraform -chdir=terraform apply -input=false -no-color -lock-timeout=10m "$RUNNER_TEMP/terraform.tfplan"
      - name: Remove temporary credentials and plan
        if: always()
        run: rm -f -- "$RUNNER_TEMP/yc-service-account.json" "$RUNNER_TEMP/terraform.tfplan" terraform/terraform.auto.tfvars.json terraform/backend.ci.hcl
