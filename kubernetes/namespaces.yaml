apiVersion: v1
kind: Namespace
metadata:
  name: diplom-ingress
  labels:
    app.kubernetes.io/part-of: diplom
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: diplom-monitoring
