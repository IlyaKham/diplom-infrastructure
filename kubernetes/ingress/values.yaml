fullnameOverride: diplom-ingress
deployment:
  replicas: 2
ingressClass:
  enabled: true
  name: diplom
  isDefaultClass: false
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    ingressClass: diplom
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: false
api:
  dashboard: false
ingressRoute:
  dashboard:
    enabled: false
ports:
  web:
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
  websecure:
    expose:
      default: false
service:
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    cpu: 200m
    memory: 128Mi
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: diplom-ingress-diplom-ingress
log:
  level: WARN
