fullnameOverride: diplom-monitoring

# Managed control plane components are not exposed as scrape endpoints.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

prometheus:
  prometheusSpec:
    replicas: 1
    # Disable the chart-generated affinity so it does not override our shared rule.
    podAntiAffinity: ""
    affinity: &monitoringAffinity
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [prometheus, alertmanager, grafana]
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 24h
    retentionSize: 1GB
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      emptyDir:
        sizeLimit: 2Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    podAntiAffinity: ""
    affinity: *monitoringAffinity
    retention: 24h
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      emptyDir:
        sizeLimit: 128Mi

grafana:
  fullnameOverride: diplom-grafana
  affinity: *monitoringAffinity
  admin:
    existingSecret: diplom-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  grafana.ini:
    server:
      serve_from_sub_path: true
      domain: '46.243.210.163'
      root_url: 'http://46.243.210.163/grafana/'
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
  readinessProbe:
    httpGet:
      path: /grafana/api/health
      port: 3000
  livenessProbe:
    httpGet:
      path: /grafana/api/health
      port: 3000
  serviceMonitor:
    enabled: true
    path: /grafana/metrics
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Samara
  defaultDashboardsEditable: false

kube-state-metrics:
  fullnameOverride: diplom-kube-state-metrics
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  fullnameOverride: diplom-node-exporter
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi
