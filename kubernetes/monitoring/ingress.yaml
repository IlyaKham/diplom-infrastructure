apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diplom-grafana
  namespace: diplom-monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: diplom
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: diplom-grafana
                port:
                  name: http-web
